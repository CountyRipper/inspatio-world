report:
  language: zh-CN
  label_latest_method_in_chinese: true
  complete_revisit_video_required: true
  complete_revisit_scope: B1_visit_through_B2_revisit
  short_reentry_clip_is_supplemental: true
  embed_videos_as_base64: false

architecture:
  framework: mapkv.report_framework
  complete_pipeline_required: true
  graph_required: true
  graph_language: zh-CN
  retain_unchanged_modules: true
  highlight_current_focus: true
  mark_change_types:
    - added
    - modified
    - removed
    - unchanged
  require_change_annotation_fields:
    - before
    - after
    - affected_files
    - rationale
  no_change_text: 本次无架构变化
  required_artifacts:
    - architecture_state.json
    - architecture_changes.json
    - architecture.md
    - assets/architecture_graph.svg

surfel:
  primary_color_source: generated_historical_rgb_observations
  primary_views:
    - rgb_world_overview
    - rgb_target_camera_zbuffer
  secondary_audit_views:
    - chunk_id
    - depth
    - confidence
    - oriented_disk
  preferred_style: pending_user_selection
  candidate_styles:
    - A_rgb_world_splats
    - B_rgb_oriented_disks
    - C_rgb_target_camera_zbuffer
    - D_rgb_b1_target_zbuffer
    - E_rgb_b1_target_overlay
