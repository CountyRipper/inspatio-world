# Read-only WorldState Teacher v0. The formal reader never uses direct residual injection.
experiment:
  base_config: configs/inference_1.3b.yaml
  checkpoint: checkpoints/InSpatio-World-1.3B/InSpatio-World-1.3B.safetensors
  direct_adapter: artifacts/exact_identity/adapter.safetensors
  data_root: data/world_teacher_v0
  artifact_root: artifacts/world_teacher_v0
  block_size: 3
  write_block: 6
  common_prefix_last_block: 12
  second_traversal_first_block: 13
  first_exact_block: 16
  transition_seed: 20260812

scenes:
  S0:
    metadata_json: test/example/new.json
    da3_dir: test/example/new_vggt/cropped_source_da3_tmp
    world_a_seed: 0
    world_b_seed: 42
  S1:
    metadata_json: test/example2/new.json
    da3_dir: test/example2/new_vggt/coffee_martini_da3_tmp
    world_a_seed: 1
    world_b_seed: 43

trajectory:
  # Pixel-frame ranges. Latent pose i uses actual camera frame 4*i.
  first_ramp_start: 24
  first_ramp_end: 56
  return_ramp_start: 84
  return_ramp_end: 116
  second_ramp_start: 156
  second_ramp_end: 188
  yaw_degrees: 40.0
  rotation_only: true

reader:
  selected_layers: [8, 14, 20]
  world_width: 512
  heads: 8
  top_observations: 2
  neighborhood: 3
  lora_rank: 8

training:
  learning_rate: 0.0002
  continuous_learning_rate: 0.0001
  two_block_learning_rate: 0.00005
  weight_decay: 0.01
  exact_reader_steps: 120
  exact_lora_steps: 160
  continuous_steps: 300
  two_block_steps: 50
  gradient_accumulation: 1
  gradient_checkpointing: true
  save_every: 20
  raw_l1_weight: 1.0
  cosine_weight: 0.05
  unknown_consistency_weight: 0.01
  source_static_threshold: 0.65
  generated_static_threshold: 0.35

evaluation:
  continuous_blocks: [13, 14, 15, 16, 17, 18]
  paired_target_blocks: [2, 3, 4, 5, 6, 6]
  hold_blocks: [16, 17, 18]
  end_block: 18
  two_block_windows:
    - [13, 14, 2, 3]  # first-visible -> next-overlap
    - [15, 16, 4, 5]  # near -> exact
    - [16, 17, 5, 6]  # exact -> HOLD 1
    - [17, 18, 6, 6]  # HOLD 1 -> HOLD 2
